<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会員登録 — HACCO</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .register-page {
      padding: 64px 24px;
      min-height: calc(100vh - var(--header-h));
    }

    .register-container {
      max-width: 560px;
      margin: 0 auto;
    }

    .register-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .register-header .auth-logo {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--color-primary);
      margin-bottom: 16px;
      display: block;
    }

    .register-form {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 40px;
    }

    .form-section-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin: 28px 0 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
    }

    .form-section-title:first-child { margin-top: 0; }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .birthday-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
    }

    .agreement-area {
      background: var(--color-surface-warm);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 20px;
      margin: 24px 0;
    }

    .register-submit {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .login-link-area {
      text-align: center;
      font-size: 14px;
      color: var(--color-text-muted);
      margin-top: 20px;
    }

    .login-link-area a {
      color: var(--color-accent);
      border-bottom: 1px solid var(--color-accent);
      padding-bottom: 1px;
    }

    @media (max-width: 480px) {
      .register-form { padding: 24px; }
      .name-row { grid-template-columns: 1fr; }
      .birthday-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="site-logo">HACCO</a>
    <nav class="header-nav">
      <a href="products.html">商品一覧</a>
      <a href="taste-quiz.html">テイスト診断</a>
      <a href="breweries.html">ブルワリー</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="action-btn cart-btn" aria-label="カート">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" /></svg>
        <span class="cart-badge">2</span>
      </a>
    </div>
  </div>
</header>

<div class="register-page">
  <div class="register-container">
    <div class="register-header">
      <span class="auth-logo">HACCO</span>
      <h1 style="font-size:28px;font-weight:700;color:var(--color-primary);margin-bottom:8px;">会員登録</h1>
      <p style="font-size:14px;color:var(--color-text-muted);">会員登録でお気に入り管理・購入履歴の確認ができます</p>
    </div>

    <form class="register-form" onsubmit="handleRegister(event)">

      <div class="form-section-title">お名前</div>
      <div class="name-row">
        <div class="form-group">
          <label class="form-label" for="lastName">姓</label>
          <input type="text" id="lastName" class="form-input" placeholder="田中" required autocomplete="family-name">
        </div>
        <div class="form-group">
          <label class="form-label" for="firstName">名</label>
          <input type="text" id="firstName" class="form-input" placeholder="さくら" required autocomplete="given-name">
        </div>
      </div>

      <div class="form-section-title">メールアドレス</div>
      <div class="form-group">
        <label class="form-label" for="regEmail">メールアドレス</label>
        <input type="email" id="regEmail" class="form-input" placeholder="your@email.com" required autocomplete="email">
        <span class="form-hint">登録確認メールをお送りします</span>
      </div>

      <div class="form-section-title">パスワード</div>
      <div class="form-group" style="margin-bottom:16px;">
        <label class="form-label" for="regPassword">パスワード</label>
        <input type="password" id="regPassword" class="form-input" placeholder="8文字以上" required autocomplete="new-password" minlength="8">
        <span class="form-hint">半角英数字8文字以上</span>
      </div>
      <div class="form-group">
        <label class="form-label" for="regPasswordConfirm">パスワード（確認）</label>
        <input type="password" id="regPasswordConfirm" class="form-input" placeholder="もう一度入力" required autocomplete="new-password">
      </div>

      <div class="form-section-title">生年月日（年齢確認）</div>
      <div class="form-group">
        <label class="form-label">生年月日</label>
        <div class="birthday-row">
          <div class="form-group">
            <select class="form-select" required>
              <option value="">年</option>
              <option>1990年</option>
              <option>1991年</option>
              <option>1992年</option>
              <option>1993年</option>
              <option>1994年</option>
              <option>1995年</option>
              <option>2000年</option>
              <option>2005年</option>
            </select>
          </div>
          <div class="form-group">
            <select class="form-select" required>
              <option value="">月</option>
              <option>1月</option><option>2月</option><option>3月</option>
              <option>4月</option><option>5月</option><option>6月</option>
              <option>7月</option><option>8月</option><option>9月</option>
              <option>10月</option><option>11月</option><option>12月</option>
            </select>
          </div>
          <div class="form-group">
            <select class="form-select" required>
              <option value="">日</option>
              <option>1日</option><option>5日</option><option>10日</option>
              <option>15日</option><option>20日</option><option>25日</option><option>31日</option>
            </select>
          </div>
        </div>
        <span class="form-hint">20歳未満の方は会員登録できません</span>
      </div>

      <!-- Agreement -->
      <div class="agreement-area">
        <div style="font-size:14px;font-weight:600;color:var(--color-primary);margin-bottom:12px;">同意事項</div>
        <label class="form-check" style="margin-bottom:10px;">
          <input type="checkbox" required>
          <span><a href="#" style="color:var(--color-accent);">利用規約</a>に同意します</span>
        </label>
        <label class="form-check">
          <input type="checkbox" required>
          <span><a href="#" style="color:var(--color-accent);">プライバシーポリシー</a>に同意します</span>
        </label>
      </div>

      <div class="register-submit">
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">登録する</button>
        <p style="font-size:12px;color:var(--color-text-muted);text-align:center;">
          登録後、確認メールをお送りします。メール内のリンクをクリックして登録を完了してください。
        </p>
      </div>
    </form>

    <div class="login-link-area">
      すでに会員の方は <a href="login.html">ログイン</a>
    </div>
  </div>
</div>

<div class="prototype-badge">Prototype</div>

<script>
  function handleRegister(e) {
    e.preventDefault();
    const pw = document.getElementById('regPassword').value;
    const pw2 = document.getElementById('regPasswordConfirm').value;
    if (pw !== pw2) {
      document.getElementById('regPasswordConfirm').classList.add('error');
      return;
    }
    window.location.href = 'mypage.html';
  }
</script>
</body>
</html>
