<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン — HACCO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: calc(100vh - var(--header-h));
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 768px) {
      .auth-page { grid-template-columns: 1fr; }
      .auth-visual { display: none; }
    }

    .auth-visual {
      background: var(--color-primary);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 48px;
    }
    .auth-visual-bg {
      position: absolute;
      inset: 0;
      background: url('https://placehold.co/800x1000/0e3d87/1350b2?text=.') center/cover;
      opacity: 0.3;
    }
    .auth-visual-content {
      position: relative;
      z-index: 1;
    }
    .auth-visual h2 {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 900;
      color: white;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    .auth-visual h2 span { color: var(--color-accent); }
    .auth-visual p { color: rgba(255,255,255,0.75); font-size: 15px; line-height: 1.7; }

    .auth-form-area {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .auth-form-box {
      width: 100%;
      max-width: 400px;
    }
    .auth-form-box h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }
    .auth-form-box .auth-subtitle {
      font-size: 14px;
      color: var(--color-text-muted);
      margin-bottom: 36px;
    }
    .auth-links {
      text-align: center;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .auth-links a {
      font-size: 13px;
      color: var(--color-text-muted);
    }
    .auth-links a:hover { color: var(--color-primary); }
    .auth-divider {
      text-align: center;
      position: relative;
      margin: 24px 0;
    }
    .auth-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--color-border-light);
    }
    .auth-divider span {
      position: relative;
      background: var(--color-bg);
      padding: 0 12px;
      font-size: 12px;
      color: var(--color-text-muted);
    }

    .password-field {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      display: flex;
    }
    .password-toggle:hover { color: var(--color-primary); }
  </style>
</head>
<body>

<!-- ヘッダー（シンプル） -->
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="site-logo">HACC<span>O</span></a>
    <div class="header-actions" style="margin-left: auto;">
      <a href="register.html" style="font-size: 13px; color: var(--color-text-muted);">アカウントをお持ちでない方</a>
      <a href="register.html" class="btn btn-primary btn-sm">新規登録</a>
    </div>
  </div>
</header>

<main class="auth-page">
  <!-- ビジュアルエリア -->
  <div class="auth-visual">
    <div class="auth-visual-bg"></div>
    <div class="auth-visual-content">
      <h2>好みのビールを、<br><span>もっと深く</span>楽しむ。</h2>
      <p>会員になると、お気に入り管理・注文履歴・テイスト診断の保存など、より豊かなクラフトビール体験ができます。</p>
    </div>
  </div>

  <!-- フォームエリア -->
  <div class="auth-form-area">
    <div class="auth-form-box">
      <h1>ログイン</h1>
      <p class="auth-subtitle">HACCOのアカウントにサインインしてください</p>

      <form onsubmit="event.preventDefault(); window.location.href='mypage.html';">
        <div class="form-group">
          <label class="form-label" for="email">メールアドレス</label>
          <input type="email" class="form-input" id="email" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">
            パスワード
            <a href="#" style="float: right; font-size: 12px; font-weight: 400; color: var(--color-text-muted);">パスワードを忘れた方</a>
          </label>
          <div class="password-field">
            <input type="password" class="form-input" id="password" placeholder="パスワードを入力" autocomplete="current-password">
            <button type="button" class="password-toggle" aria-label="パスワードを表示/非表示">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 24px;">
          <label class="checkbox-label">
            <input type="checkbox">
            <span>ログイン状態を保持する</span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">ログイン</button>
      </form>

      <div class="auth-divider"><span>または</span></div>

      <div class="auth-links">
        <p style="font-size: 14px; color: var(--color-text-muted);">まだアカウントをお持ちでないですか？</p>
        <a href="register.html" class="btn btn-secondary btn-block">新規会員登録はこちら</a>
      </div>

      <p style="font-size: 11px; color: var(--color-text-muted); text-align: center; margin-top: 24px; line-height: 1.6;">
        ログインすることで<a href="#" style="color: var(--color-text-muted); text-decoration: underline;">利用規約</a>および
        <a href="#" style="color: var(--color-text-muted); text-decoration: underline;">プライバシーポリシー</a>に同意したものとみなします。
      </p>
    </div>
  </div>
</main>

<!-- Prototype Nav -->
<nav class="proto-nav">
  <div class="proto-nav-header" onclick="this.nextElementSibling.classList.toggle('open')">
    <span>Prototype Nav</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </div>
  <div class="proto-nav-list">
    <a href="index.html">トップページ</a>
    <a href="products.html">商品一覧</a>
    <a href="product-detail.html">商品詳細</a>
    <a href="cart.html">カート</a>
    <a href="checkout.html">チェックアウト</a>
    <a href="order-complete.html">注文完了</a>
    <a href="taste-quiz.html">テイスト診断</a>
    <a href="taste-result.html">診断結果</a>
    <a href="breweries.html">ブルワリー一覧</a>
    <a href="login.html">★ ログイン</a>
    <a href="register.html">会員登録</a>
    <a href="mypage.html">マイページ</a>
  </div>
</nav>
</body>
</html>
