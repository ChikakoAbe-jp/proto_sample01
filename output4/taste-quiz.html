<main>

              <div><p class="quiz-option__text">中級者</p><p class="quiz-option__sub">いくつか飲んだことがある</p></div>

              <div class="quiz-option__icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg></div>

        <!-- Q4 -->

              <div><p class="quiz-option__text">琥珀色・赤みがかった</p><p class="quiz-option__sub">エール・アンバー系</p></div>

              <div><p class="quiz-option__text">深い黒褐色</p><p class="quiz-option__sub">スタウト・ポーター系</p></div>

        <span></span>
        <button class="btn btn--primary" id="nextBtn" onclick="nextQ()" disabled>
          次の質問

<div class="proto-nav" id="protoNav">
  <button class="proto-nav__toggle" onclick="this.closest('.proto-nav').classList.toggle('is-open')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>Prototype</button>
  <div class="proto-nav__list"><a href="index.html">トップページ</a><a href="products.html">商品一覧</a><a href="product-detail.html">商品詳細</a><a href="cart.html">カート</a><a href="checkout.html">チェックアウト</a><a href="order-complete.html">注文完了</a><a href="taste-quiz.html">🔵 テイスト診断</a><a href="taste-result.html">診断結果</a><a href="breweries.html">ブルワリー一覧</a><a href="login.html">ログイン</a><a href="register.html">会員登録</a><a href="mypage.html">マイページ</a></div>
</div>

<script>
let current = 1;
const total = 4;
const answers = {};

function selectOption(el, qid) {
  el.closest('.quiz-options').querySelectorAll('.quiz-option').forEach(o => o.classList.remove('is-selected'));
  el.classList.add('is-selected');
  answers[qid] = el.querySelector('.quiz-option__text').textContent;
  document.getElementById('nextBtn').disabled = false;
}

function nextQ() {
  if (current < total) {
    document.getElementById('q' + current).style.display = 'none';
    current++;
    const qEl = document.getElementById('q' + current);
    qEl.style.display = 'block';
    qEl.style.animation = 'none';
    qEl.offsetHeight;
    qEl.style.animation = '';
    updateProgress();
    document.getElementById('prevBtn').style.display = 'flex';
    document.getElementById('nextBtn').disabled = !answers['q' + current];
    if (current === total) document.getElementById('nextBtn').textContent = '診断結果を見る ›';
  } else {
    window.location.href = 'taste-result.html';
  }
}

function prevQ() {
  if (current > 1) {
    document.getElementById('q' + current).style.display = 'none';
    current--;
    document.getElementById('q' + current).style.display = 'block';
    updateProgress();
    if (current === 1) document.getElementById('prevBtn').style.display = 'none';
    document.getElementById('nextBtn').disabled = false;
    document.getElementById('nextBtn').textContent = current < total ? '次の質問 ›' : '診断結果を見る ›';
  }
}

function updateProgress() {
  const pct = Math.round((current / total) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = 'Q' + current + ' / ' + total;
  document.getElementById('progressPct').textContent = pct + '%';
}

document.addEventListener('click', function(e) {
  const nav = document.getElementById('protoNav');
  if (!nav.contains(e.target)) nav.classList.remove('is-open');
});
</script>
