<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン — HACCO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ヘッダー -->
<header class="header">
  <div class="container">
    <nav class="nav">
      <a href="index.html" class="logo">HACCO</a>
      <ul class="nav-links">
        <li><a href="products.html">商品一覧</a></li>
        <li><a href="taste-quiz.html">テイスト診断</a></li>
        <li><a href="breweries.html">ブルワリー</a></li>
      </ul>
      <div class="nav-right">
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="メニュー">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
        </button>
      </div>
    </nav>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <ul>
      <li><a href="products.html">商品一覧</a></li>
      <li><a href="taste-quiz.html">テイスト診断</a></li>
      <li><a href="breweries.html">ブルワリー</a></li>
    </ul>
  </div>
</header>

<div class="auth-layout">
  <div class="auth-card">

    <a href="index.html" class="auth-logo">HACCO</a>
    <h1 class="auth-title">ログイン</h1>
    <p class="auth-subtitle">会員の方はこちらからログインしてください</p>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label form-label-required" for="email">メールアドレス</label>
        <input
          type="email"
          id="email"
          class="input"
          placeholder="example@email.com"
          value="tanaka@example.com"
          autocomplete="email"
          required>
      </div>

      <div class="form-group">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-2);">
          <label class="form-label form-label-required" for="password" style="margin-bottom:0;">パスワード</label>
          <a href="#" style="font-size:12px;color:var(--color-primary);">パスワードを忘れた方</a>
        </div>
        <div style="position:relative;">
          <input
            type="password"
            id="password"
            class="input"
            placeholder="パスワードを入力"
            value="password123"
            autocomplete="current-password"
            required>
          <button
            type="button"
            onclick="togglePassword('password')"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--color-text-muted);width:24px;height:24px;display:flex;align-items:center;justify-content:center;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:18px;height:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
          </button>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:var(--space-6);">
        <label class="checkbox-label">
          <input type="checkbox" checked>
          ログイン状態を保持する
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg">
        ログイン
      </button>
    </form>

    <div class="auth-footer">
      <p>アカウントをお持ちでない方は<a href="register.html">新規会員登録</a></p>
    </div>

    <div class="auth-divider" style="margin-top:var(--space-6);">
      <span>または</span>
    </div>

    <div style="text-align:center;padding-top:var(--space-2);">
      <a href="products.html" style="font-size:13px;color:var(--color-text-muted);">
        ゲストとして買い物を続ける
      </a>
    </div>

  </div>
</div>

<div class="prototype-badge">Prototype</div>

<script>
  function toggleMenu() {
    document.getElementById('mobileMenu').classList.toggle('is-open');
  }
  function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }
  function handleLogin(e) {
    e.preventDefault();
    window.location.href = 'mypage.html';
  }
</script>
</body>
</html>
